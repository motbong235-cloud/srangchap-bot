services:
  - type: web
    name: srangchap-bot
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.11.0"
    disk:
      name: srangchap-data
      mountPath: /var/data
      sizeGB: 1
